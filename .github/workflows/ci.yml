name: CI - Release & Staging Validation

on:
  pull_request:
    branches: [ release, 'release/**', 'release/*' ]
  push:
    branches: [ release, 'release/**', 'release/*' ]
  workflow_dispatch:

jobs:
  validate:
    name: Flutter Lint, Test & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=show --set-exit-if-changed .

      - name: Analyze code (Linter)
        run: flutter analyze

      - name: Run widget & unit tests with coverage
        run: flutter test --coverage

      - name: Ensure environment file exists
        run: cp .env.example .env 2>/dev/null || touch .env

      - name: Verify Web Build
        run: flutter build web --release

      - name: Apply DB Migrations to Supabase QA
        if: github.event_name == 'push' && env.SUPABASE_QA_DB_URL != ''
        env:
          SUPABASE_QA_DB_URL: ${{ secrets.SUPABASE_QA_DB_URL }}
        run: |
          echo "[CI] Verificando migraciones de esquema para Supabase QA..."
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          psql "$SUPABASE_QA_DB_URL" -c "CREATE TABLE IF NOT EXISTS schema_migrations (version VARCHAR(50) PRIMARY KEY, description TEXT NOT NULL, applied_at TIMESTAMPTZ NOT NULL DEFAULT now());"
          APPLIED_VERSIONS=$(psql "$SUPABASE_QA_DB_URL" -t -A -c "SELECT version FROM schema_migrations;")
          for file in $(ls -1 database/migrations/*.sql | sort); do
            filename=$(basename "$file")
            version=$(echo "$filename" | grep -oE "^[0-9]+" || echo "$filename")
            if echo "$APPLIED_VERSIONS" | grep -qx "$version"; then
              echo "  [OK] $filename ya aplicada en Supabase QA."
            else
              echo "  [APLICANDO] $filename en Supabase QA..."
              psql "$SUPABASE_QA_DB_URL" -v ON_ERROR_STOP=1 < "$file"
              echo "  [ÉXITO] $filename aplicada correctamente en Supabase QA."
            fi
          done

