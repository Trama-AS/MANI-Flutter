name: CI - Production Validation (main)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Flutter Lint, Test & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Deshabilita shallow clone para análisis preciso de SonarQube

      - name: Ensure environment file exists
        run: cp .env.example .env 2>/dev/null || touch .env

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=show --set-exit-if-changed .

      - name: Analyze code (Linter)
        run: flutter analyze

      - name: Run widget & unit tests with coverage
        run: flutter test --coverage

      # - name: SonarQube Scan
      #   uses: sonarsource/sonarqube-scan-action@v4
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: https://sonarcloud.io

      # - name: SonarQube Quality Gate Check
      #   uses: sonarsource/sonarqube-quality-gate-action@v1
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: https://sonarcloud.io

      - name: Verify Web Build
        run: flutter build web --release
