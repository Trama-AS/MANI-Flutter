name: CI - Flutter (lint, pruebas, SonarQube Cloud y build)

# Lint, pruebas con cobertura, análisis de SonarQube Cloud con espera del Quality
# Gate (ADR-0005) y build web. SonarQube Community de la VM de Calidad no analiza
# Dart; por eso Flutter usa SonarQube Cloud (organización trama-as, proyecto
# Trama-AS_MANI-Flutter), que sí analiza ramas y pull requests.
#
# Requisito: secreto SONAR_TOKEN del repositorio con un token de SonarQube Cloud.
# Tiene prioridad sobre el SONAR_TOKEN de la organización, que es del servidor
# self-hosted y no sirve aquí.

on:
  pull_request:
    branches: [ develop, release, main ]
  push:
    branches: [ develop, main ]
  workflow_dispatch:

# En PR se cancela la corrida anterior; en push cada commit conserva su análisis.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Flutter Lint, Test & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Deshabilita shallow clone para análisis preciso de SonarQube

      - name: Ensure environment file exists
        run: cp .env.example .env 2>/dev/null || touch .env

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=show --set-exit-if-changed .

      - name: Analyze code (Linter)
        run: flutter analyze

      - name: Run widget & unit tests with coverage
        run: flutter test --coverage

      # Los PRs desde forks no reciben secretos: el job falla aquí en vez de
      # pasar sin análisis.
      - name: Verificar token de SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN no está disponible (secreto faltante o PR desde un fork)."
            exit 1
          fi

      # v8.2.2 fijada por SHA del tag (ba9859e). Espera el Quality Gate: si falla,
      # falla el job y el check requerido del ruleset.
      - name: Análisis de SonarQube Cloud y espera del Quality Gate
        uses: sonarsource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Verify Web Build
        run: flutter build web --release
