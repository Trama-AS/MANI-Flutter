name: CI - Release & Staging Validation

on:
  pull_request:
    branches: [ release, 'release/**', 'release/*' ]
  push:
    branches: [ release, 'release/**', 'release/*' ]
  workflow_dispatch:

jobs:
  validate:
    name: Flutter Lint, Test & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=show --set-exit-if-changed .

      - name: Analyze code (Linter)
        run: flutter analyze

      - name: Run widget & unit tests with coverage
        run: flutter test --coverage

      - name: Ensure environment file exists
        run: cp .env.example .env 2>/dev/null || touch .env

      - name: Verify Web Build
        run: flutter build web --release
