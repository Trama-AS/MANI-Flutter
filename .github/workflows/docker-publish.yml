name: Build & Publish Docker Image to GHCR

on:
  push:
    branches:
      - main
      - release
      - develop
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure environment file for target branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/release" ]; then
            echo "Configuring .env for QA (staging / release)..."
            cat << 'EOF' > .env
          SUPABASE_URL=https://hpsxdotaizzclkeufzct.supabase.co
          SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhwc3hkb3RhaXp6Y2xrZXVmemN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MjUxNzksImV4cCI6MjEwNTUwMTE3OX0.8tTgx6SpLGvM_Ipa1hSyv0OCmig0LKfjnWKO2gWPyHA
          API_GATEWAY_URL=http://10.43.100.141
          TENANT_SLUG=acme-servicios
          EOF
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "Configuring .env for DEV (develop)..."
            cat << 'EOF' > .env
          SUPABASE_URL=https://hpsxdotaizzclkeufzct.supabase.co
          SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhwc3hkb3RhaXp6Y2xrZXVmemN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MjUxNzksImV4cCI6MjEwNTUwMTE3OX0.8tTgx6SpLGvM_Ipa1hSyv0OCmig0LKfjnWKO2gWPyHA
          API_GATEWAY_URL=http://10.43.98.232
          TENANT_SLUG=acme-servicios
          EOF
          else
            echo "Configuring .env for PROD (main / default)..."
            cat << 'EOF' > .env
          SUPABASE_URL=https://tjxueukivwxsgipltqwb.supabase.co
          SUPABASE_ANON_KEY=sb_publishable_AnU3BL3OAck0GuPll8NWVQ_0xE1h2Es
          API_GATEWAY_URL=http://10.43.98.203
          TENANT_SLUG=acme-servicios
          EOF
          fi
          test -s .env || (echo "ERROR: .env esta vacio o no se pudo generar" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/release' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
