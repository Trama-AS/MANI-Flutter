# =====================================================================
# Configuración de SonarQube / SonarCloud para MANI-Flutter
# Referencia: ADR-0005 (SAST en CI/CD con SonarQube)
# Ubicación: Guardar en la raíz del repositorio MANI-Flutter
# =====================================================================

# Identificación del Proyecto
sonar.projectKey=Trama-AS_MANI-Flutter
sonar.organization=trama-as
sonar.projectName=MANI-Flutter

# Codificación de archivos
sonar.sourceEncoding=UTF-8

# Rutas de codigo fuente y pruebas
sonar.sources=lib
sonar.tests=test

# Reporte de cobertura generado por "flutter test --coverage"
sonar.dart.coverage.reportPaths=coverage/lcov.info
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Exclusiones de analisis estatico
# Evita analizar codigo autogenerado y bundles compilados
sonar.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart,\
  web/**,\
  build/**,\
  .dart_tool/**,\
  test/.test_coverage.dart,\
  .github/**
