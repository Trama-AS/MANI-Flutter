server {
    listen 80;
    server_name localhost;

    # API del Gateway por el mismo origen de la app, para redes donde solo se publica el puerto de la app
    # (en QA la VPN bloquea 80/443 de la VM). El nombre se resuelve en cada petición con el DNS de Docker,
    # así nginx arranca aunque no exista mani-api-gateway en la red; en ese caso /api/ responde 502.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mani_api_gateway http://mani-api-gateway:80;
        proxy_pass $mani_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 90s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Archivos de arranque de Flutter (SCRUM-1645): se revalidan siempre, para que una versión nueva llegue en la
    # primera carga y no tras 30 días. `no-cache` no impide guardarlos: obliga a preguntar al servidor y, si no cambiaron,
    # responde 304 sin descargar de nuevo.
    location ~* ^/(?:index\.html|flutter_bootstrap\.js|flutter\.js|flutter_service_worker\.js|main\.dart\.js|version\.json|manifest\.json)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Recursos que no cambian entre compilaciones sin cambiar de nombre (fuentes, imágenes, video de arranque): 30 días.
    location ~* \.(?:css|map|jpe?g|gif|png|ico|svg|woff|woff2|ttf|eot|mp4|wasm)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
