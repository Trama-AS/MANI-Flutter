server {
    listen 80;
    server_name localhost;

    # API del Gateway por el mismo origen de la app, para redes donde solo se publica el puerto de la app
    # (en QA la VPN bloquea 80/443 de la VM). El nombre se resuelve en cada petición con el DNS de Docker,
    # así nginx arranca aunque no exista mani-api-gateway en la red; en ese caso /api/ responde 502.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mani_api_gateway http://mani-api-gateway:80;
        proxy_pass $mani_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 90s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Evitar cache de main.dart.js e index.html para reflejar cambios inmediatamente
    location ~* (index\.html|main\.dart\.js|flutter_bootstrap\.js)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Cache static assets
    location ~* \.(?:css|map|jpe?g|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
